name: SimBridge
options:
  bundleIdPrefix: com.simbridge
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  defaultConfig: Release

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: "NO"
    ENABLE_BITCODE: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    PRODUCT_BUNDLE_IDENTIFIER: "$(SIMBRIDGE_BUNDLE_ID)"
    SIMBRIDGE_BUNDLE_ID: "com.simbridge.ios"

targets:
  SimBridge:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: SimBridge/Sources
    settings:
      base:
        INFOPLIST_FILE: SimBridge/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: SimBridge/Resources/SimBridge.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: SimBridge/Sources/Bridge/SimBridge-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/ThirdParty/opus-1.5.2/include"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/ThirdParty/build-opus-ios"
          - "$(PROJECT_DIR)/ThirdParty/build-opus-ios/Release-iphoneos"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lopus"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
